name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Assemble Flutter project
        run: |
          flutter create --platforms android --org com.ezzat "$RUNNER_TEMP/radio_app"
          APP="$RUNNER_TEMP/radio_app"
          rm -rf "$APP/lib" "$APP/test"
          cp -r lib "$APP/lib"
          cp android/app/src/main/AndroidManifest.xml "$APP/android/app/src/main/AndroidManifest.xml"
          cp android/app/src/main/kotlin/com/ezzat/radio_app/MainActivity.kt \
             "$APP/android/app/src/main/kotlin/com/ezzat/radio_app/MainActivity.kt"
          cd "$APP"
          flutter pub add just_audio audio_service http shared_preferences cached_network_image

      - name: Build release APK
        working-directory: ${{ runner.temp }}/radio_app
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/radio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: radio-apk
          path: ${{ runner.temp }}/radio_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish release (download link for the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Radio build ${{ github.run_number }}
          make_latest: true
          files: ${{ runner.temp }}/radio_app/build/app/outputs/flutter-apk/radio.apk
