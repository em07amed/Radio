name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Assemble Flutter project
        run: |
          flutter create --platforms android --org com.ezzat "$RUNNER_TEMP/radio_app"
          APP="$RUNNER_TEMP/radio_app"
          rm -rf "$APP/lib" "$APP/test"
          cp -r lib "$APP/lib"
          cp android/app/src/main/AndroidManifest.xml "$APP/android/app/src/main/AndroidManifest.xml"
          cp android/app/src/main/kotlin/com/ezzat/radio_app/MainActivity.kt \
             "$APP/android/app/src/main/kotlin/com/ezzat/radio_app/MainActivity.kt"
          cp -r android/app/src/main/res/. "$APP/android/app/src/main/res/"
          cd "$APP"
          flutter pub add just_audio audio_service http shared_preferences cached_network_image package_info_plus url_launcher

      - name: Use fixed signing key (so updates install over the old app)
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | base64 -d > ~/.android/debug.keystore
            echo "Fixed signing key installed"
          else
            echo "::warning::DEBUG_KEYSTORE_B64 secret not set - APK will get a random key"
          fi

      - name: Build APK (GitHub) and AAB (Google Play)
        working-directory: ${{ runner.temp }}/radio_app
        run: |
          V="--build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}"
          flutter build apk --release $V --dart-define=STORE=github
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/radio.apk
          flutter build appbundle --release $V --dart-define=STORE=play
          cp build/app/outputs/bundle/release/app-release.aab build/app/outputs/bundle/release/radio-play.aab

      - uses: actions/upload-artifact@v4
        with:
          name: radio-builds
          path: |
            ${{ runner.temp }}/radio_app/build/app/outputs/flutter-apk/radio.apk
            ${{ runner.temp }}/radio_app/build/app/outputs/bundle/release/radio-play.aab

      - name: Publish release (download link for the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Radio build ${{ github.run_number }}
          make_latest: true
          files: |
            ${{ runner.temp }}/radio_app/build/app/outputs/flutter-apk/radio.apk
            ${{ runner.temp }}/radio_app/build/app/outputs/bundle/release/radio-play.aab
